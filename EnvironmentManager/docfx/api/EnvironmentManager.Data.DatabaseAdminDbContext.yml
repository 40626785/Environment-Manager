  assemblies:
  - EnvironmentManager
  namespace: EnvironmentManager.Data
  summary: >-
    Override this method to configure the database (and other options) to be used for this context.

    This method is called for each instance of the context that is created.

    The base implementation does nothing.
  remarks: >-
    <p>
        In situations where an instance of <xref href="Microsoft.EntityFrameworkCore.DbContextOptions" data-throw-if-not-resolved="false"></xref> may or may not have been passed
        to the constructor, you can use <xref href="Microsoft.EntityFrameworkCore.DbContextOptionsBuilder.IsConfigured" data-throw-if-not-resolved="false"></xref> to determine if
        the options have already been set, and skip some or all of the logic in
        <xref href="Microsoft.EntityFrameworkCore.DbContext.OnConfiguring(Microsoft.EntityFrameworkCore.DbContextOptionsBuilder)" data-throw-if-not-resolved="false"></xref>.
    </p>

    <p>
        See <a href="https://aka.ms/efcore-docs-dbcontext">DbContext lifetime, configuration, and initialization</a>
        for more information and examples.
    </p>
